<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decimal ⇄ Hex calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef1f5;--panel:#fff;--ink:#14202e;--mute:#66758a;--line:#d3dae4;
  --on:#1f4fd8;--on-ink:#fff;--off:#e4e9f0;--hex:#d9611a;--bad:#c2261f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1621;--panel:#18212e;--ink:#e8edf4;--mute:#8d9bb0;--line:#2b384a;
  --on:#6d93ff;--on-ink:#0b1220;--off:#243044;--hex:#ff9250;--bad:#ff7b72;}}
:root[data-theme="dark"]{
  --bg:#0f1621;--panel:#18212e;--ink:#e8edf4;--mute:#8d9bb0;--line:#2b384a;
  --on:#6d93ff;--on-ink:#0b1220;--off:#243044;--hex:#ff9250;--bad:#ff7b72;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.6rem;margin:0 0 4px;font-weight:600}
p.sub{margin:0 0 22px;color:var(--mute);max-width:60ch}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.field input{width:100%;border:0;background:transparent;color:var(--ink);font:600 1.3rem "IBM Plex Mono",ui-monospace,monospace;outline:none;padding:0}
.field:focus-within{border-color:var(--on);box-shadow:0 0 0 2px color-mix(in srgb,var(--on) 30%,transparent)}
.field.bad{border-color:var(--bad)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--mute);font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button,.btn{font:inherit;color:var(--ink);background:var(--panel);border:0;padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.btn{border:1px solid var(--line);border-radius:8px}
button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 14px}
.row{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.blocks{display:flex;flex-wrap:wrap;gap:26px 34px;--cw:44px}
.blk{flex:0 0 auto;max-width:100%}
.bh{font-size:.85rem;color:var(--mute);margin-bottom:6px}
.bh b{color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace}
@media (max-width:520px){.blocks{--cw:31px}.cell{height:34px}.nh{font-size:1.7rem}}
.row .tag{position:sticky;left:0}
.grp{display:flex;gap:4px}
.cell{width:var(--cw);height:38px;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",ui-monospace,monospace}
.w{height:24px;font-size:.82rem;color:var(--mute)}
.nib{width:calc(var(--cw)*4 + 12px)}
.bit{border:0;border-radius:6px;background:var(--off);color:var(--mute);font-size:1.3rem;font-weight:600;cursor:pointer;padding:0}
.bit[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.nw{margin-top:10px}
.nd{font-size:1.05rem;color:var(--mute);height:30px}
.nh{font-size:2.1rem;font-weight:600;color:var(--hex);height:48px;border-top:2px solid var(--hex);border-radius:0}
.eq{margin-top:14px;color:var(--mute);font-size:.9rem;overflow-wrap:anywhere}
.eq b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Decimal ⇄ Hex calculator</h1>
  <p class="sub">Type in any box, or tap the bits. Each group of four bits (a nibble) becomes one hex digit.</p>

  <div class="inputs">
    <div class="field" id="fd"><label for="dec" id="dlab">Decimal</label><input id="dec" class="mono" inputmode="numeric" autocomplete="off" spellcheck="false"></div>
    <div class="field" id="fh"><label for="hex">Hexadecimal</label><input id="hex" class="mono" autocomplete="off" spellcheck="false" autocapitalize="characters"></div>
    <div class="field" id="fb"><label for="bin">Binary</label><input id="bin" class="mono" inputmode="numeric" autocomplete="off" spellcheck="false"></div>
  </div>

  <div class="bar">
    <span>Width</span>
    <span class="seg" id="seg"></span>
    <button class="btn" id="clear" type="button">Clear</button>
  </div>

  <div class="scroll"><div class="blocks" id="board"></div></div>
  <div class="eq" id="eq"></div>
</main>

<script>
const MAX=4294967295;
let bits=8, value=0;
const $=id=>document.getElementById(id);
const dec=$('dec'),hex=$('hex'),bin=$('bin');

function setWidthFor(v){ while(v>=Math.pow(2,bits) && bits<32) bits*=2; }

function buildSeg(){
  const seg=$('seg'); seg.innerHTML='';
  [8,16,32].forEach(n=>{
    const b=document.createElement('button');
    b.type='button'; b.textContent=n+' bit'; b.setAttribute('aria-pressed',n===bits);
    b.onclick=()=>{ bits=n; if(value>=Math.pow(2,bits)) value=value%Math.pow(2,bits); render(); };
    seg.appendChild(b);
  });
}

function bitAt(v,i){ return Math.floor(v/Math.pow(2,i))%2; }

function dotted(v){ return [24,16,8,0].map(k=>Math.floor(v/Math.pow(2,k))%256).join('.'); }

function render(skip){
  buildSeg();
  const board=$('board'); board.innerHTML='';
  const bytes=bits/8, el=(c,t)=>{const d=document.createElement('div'); d.className=c; if(t!==undefined) d.textContent=t; return d;};
  for(let by=bytes-1;by>=0;by--){
    const blk=el('blk');
    if(bytes>1){
      const h=el('bh'); const bv=Math.floor(value/Math.pow(256,by))%256;
      h.innerHTML='Byte '+(bytes-by)+': <b>'+bv+'</b>'; blk.appendChild(h);
    }
    const rows=[el('row'),el('row'),el('row nw'),el('row'),el('row')];
    rows.forEach(r=>blk.appendChild(r));
    for(let n=1;n>=0;n--){
      const nib=by*2+n;
      const g=[el('grp'),el('grp'),el('grp')];
      for(let k=3;k>=0;k--){
        const i=nib*4+k, on=bitAt(value,i)===1;
        g[0].appendChild(el('cell w',Math.pow(2,i%8)));
        const b=el('cell bit',on?1:0); b.className='cell bit'; 
        const btn=document.createElement('button'); btn.type='button'; btn.className='cell bit';
        btn.textContent=on?1:0; btn.setAttribute('aria-pressed',on);
        btn.setAttribute('aria-label','bit '+i+' (value '+Math.pow(2,i)+')');
        btn.onclick=()=>{ value+=on?-Math.pow(2,i):Math.pow(2,i); render(); };
        g[1].appendChild(btn);
        g[2].appendChild(el('cell w',Math.pow(2,k)));
      }
      rows[0].appendChild(g[0]); rows[1].appendChild(g[1]); rows[2].appendChild(g[2]);
      const nv=Math.floor(value/Math.pow(16,nib))%16;
      rows[3].appendChild(el('cell nib nd',nv));
      rows[4].appendChild(el('cell nib nh',nv.toString(16).toUpperCase()));
    }
    board.appendChild(blk);
  }
  const hs=value.toString(16).toUpperCase();
  const bs=value.toString(2).padStart(bits,'0').replace(/(.{4})(?=.)/g,'$1 ');
  const ip=bits===32;
  $('dlab').textContent=ip?'Decimal (dotted)':'Decimal';
  if(skip!=='dec') dec.value=ip?dotted(value):value;
  if(skip!=='hex') hex.value=hs;
  if(skip!=='bin') bin.value=bs;
  ['fd','fh','fb'].forEach(i=>$(i).classList.remove('bad'));
  $('eq').innerHTML=(ip?'<b>'+dotted(value)+'</b> (as one number: '+value+')':'<b>'+value+'</b> in decimal')+' = <b>0x'+hs+'</b> in hex = <b>'+bs+'</b> in binary';
}

function bad(id){ $(id).classList.add('bad'); }
function parseIn(kind){
  const el={dec,hex,bin}[kind], fid={dec:'fd',hex:'fh',bin:'fb'}[kind];
  let s=el.value.trim().replace(/\s+/g,'');
  if(kind==='hex') s=s.replace(/^0x/i,'');
  if(s===''){ value=0; render(kind); $(fid).classList.remove('bad'); return; }
  if(kind==='dec'&&/^\d+(\.\d+){3}$/.test(s)){
    const p=s.split('.').map(Number);
    if(p.some(x=>x>255)){ bad(fid); return; }
    value=p.reduce((a,x)=>a*256+x,0); bits=32; render(kind); return;
  }
  const re={dec:/^\d+$/,hex:/^[0-9a-f]+$/i,bin:/^[01]+$/}[kind];
  const base={dec:10,hex:16,bin:2}[kind];
  const v=re.test(s)?parseInt(s,base):NaN;
  if(isNaN(v)||v>MAX){ bad(fid); return; }
  value=v; setWidthFor(v); render(kind);
}
dec.oninput=()=>parseIn('dec');
hex.oninput=()=>parseIn('hex');
bin.oninput=()=>parseIn('bin');
$('clear').onclick=()=>{ value=0; render(); };
dec.value=254; value=254; render();
</script>
</body>
</html>
